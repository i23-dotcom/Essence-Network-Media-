<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Essence Network TV Broadcast Studio</title><link rel="stylesheet" href="/studio-assets/studio.css?v=6.9.0"></head>
<body>
<div id="loginScreen" class="login"><div class="login-card"><div class="brand-mark">E<span>)))</span></div><div class="eyebrow">ESSENCE NETWORK</div><h1>TV Broadcast Studio</h1><p>Friendly live television production control for sources, scenes, graphics, master control and transmission.</p><div class="login-fields"><input id="email" type="email" placeholder="Staff email" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"></div><button id="loginBtn" class="primary wide">Enter Studio</button><button id="demoBtn" class="ghost wide">Open Local Demo Studio</button><div id="loginMsg" class="msg"></div></div></div>
<div id="app" hidden>
<header class="topbar"><div class="brand"><div class="brand-mark small">E<span>)))</span></div><div><b>ESSENCE</b><small>NETWORK</small></div></div><div class="crumb">PRODUCTION STUDIO <span id="modePill" class="pill">LOCAL</span></div><div class="top-actions"><span id="clock">--:--:--</span><span id="health" class="health ok">● READY</span><span id="userBadge">Operator</span><button id="logout" class="icon-btn" title="Sign out">↪</button></div></header>
<div class="layout">
<aside id="nav" class="sidebar"><button data-view="control" class="active">◈ <span>Master Control</span></button><button data-view="sources">◉ <span>Sources</span></button><button data-view="scenes">▦ <span>Scenes</span></button><button data-view="graphics">✦ <span>Graphics</span></button><button data-view="rundown">☷ <span>Rundown</span></button><button data-view="audio">◒ <span>Audio</span></button><button data-view="record">● <span>Master Record</span></button><button data-view="engine">⇧ <span>Broadcast</span></button><button data-view="settings">⚙ <span>Station Settings</span></button><div class="side-bottom"><div class="signal"><i></i><div><b>System healthy</b><small id="signalText">Local production engine</small></div></div><button id="publicBtn" class="side-link">↗ Public TV</button></div></aside>
<main class="main"><div class="page-head"><div><span class="eyebrow">LIVE CONTROL ROOM</span><h2 id="viewTitle">Production</h2></div><div class="head-actions"><button id="clearBtn" class="ghost">CLEAR</button><button id="takeBtn" class="take">TAKE <span>Space</span></button></div></div><div id="toastHost"></div><section id="content"></section></main>
</div></div>
<script src="/studio-assets/studio.js?v=6.9.0"></script></body></html>
